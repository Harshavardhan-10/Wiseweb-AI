[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wisewebai-backend"
version = "0.1.0"
description = "Wiseweb-AI - AI-powered Website Intelligence & Improvement Platform (backend)"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/*", "app/crawler/browser.py"]

[tool.coverage.report]
show_missing = true
